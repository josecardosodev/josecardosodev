<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="José Cardoso — Suporte N3, automação em Python e infraestrutura">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a33"/>
      <stop offset="1" stop-color="#0d2a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glow" cx="0.2" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t  { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .m  { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
      .node { fill: #38bdf8; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .p2 { animation-delay: .8s } .p3 { animation-delay: 1.6s } .p4 { animation-delay: 2.2s }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1) } 50% { opacity: 1; transform: scale(1.6) } }
      .flow { stroke-dasharray: 6 10; animation: flow 2.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -32 } }
      .line { opacity: 0; animation: show 9s steps(1) infinite; }
      .l1 { animation-delay: 0s } .l2 { animation-delay: .9s } .l3 { animation-delay: 1.8s }
      .l4 { animation-delay: 2.7s } .l5 { animation-delay: 3.6s }
      @keyframes show { 0% { opacity: 1 } 100% { opacity: 1 } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .fade { animation: fade 1.2s ease-out both; }
      @keyframes fade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- rede: infraestrutura -> código -->
  <g stroke="url(#accent)" stroke-width="1.5" fill="none" opacity="0.55">
    <path class="flow" d="M60 292 L180 272 L300 294 L420 270"/>
    <path class="flow" d="M180 272 L240 258"/>
    <path class="flow" d="M420 270 L560 290"/>
  </g>
  <circle class="node pulse"    cx="60"  cy="292" r="4"/>
  <circle class="node pulse p2" cx="180" cy="272" r="4"/>
  <circle class="node pulse p3" cx="300" cy="294" r="4"/>
  <circle class="node pulse p4" cx="420" cy="270" r="4"/>
  <circle class="node pulse p2" cx="240" cy="258" r="3"/>
  <circle class="node pulse p3" cx="560" cy="290" r="3"/>

  <!-- identidade -->
  <g class="fade">
    <text x="60" y="78" class="m" font-size="16" fill="#34d399">~/josecardosodev</text>
    <text x="60" y="132" class="t" font-size="50" font-weight="700" fill="#f1f5f9">José Cardoso</text>
    <rect x="60" y="148" width="120" height="4" rx="2" fill="url(#accent)"/>
    <text x="60" y="186" class="t" font-size="21" fill="#cbd5e1">Suporte N3 · Automação em Python · Infraestrutura</text>
    <text x="60" y="216" class="t" font-size="16" fill="#94a3b8">15+ anos transformando problemas de operação em sistemas</text>
  </g>

  <!-- terminal -->
  <g transform="translate(700 52)">
    <rect width="440" height="216" rx="12" fill="#060a14" fill-opacity="0.85" stroke="#1e3a5f"/>
    <circle cx="22" cy="20" r="6" fill="#f87171"/>
    <circle cx="42" cy="20" r="6" fill="#fbbf24"/>
    <circle cx="62" cy="20" r="6" fill="#34d399"/>
    <text x="220" y="25" text-anchor="middle" class="m" font-size="12" fill="#64748b">powershell — automacao</text>
    <g class="m" font-size="15">
      <text x="22" y="66"  class="line l1" fill="#e2e8f0"><tspan fill="#34d399">PS&gt;</tspan> python triagem.py --ia claude</text>
      <text x="22" y="96"  class="line l2" fill="#94a3b8">✔ chamado classificado: <tspan fill="#38bdf8">Alta</tspan></text>
      <text x="22" y="126" class="line l3" fill="#e2e8f0"><tspan fill="#34d399">PS&gt;</tspan> pytest -q</text>
      <text x="22" y="156" class="line l4" fill="#94a3b8">✔ <tspan fill="#34d399">24 passed</tspan> in 0.45s</text>
      <text x="22" y="186" class="line l5" fill="#e2e8f0"><tspan fill="#34d399">PS&gt;</tspan> <tspan class="caret">▋</tspan></text>
    </g>
  </g>
</svg>
